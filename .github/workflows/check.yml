name: Check

# The repo's local check, `bash scripts/check.sh`, on every PR and every push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check skills
    # CI_RUNS_ON lets the billing guard move this job to a homelab runner (homelab#475). The repo is
    # private, so no fork pull request reaches it; tests/test_public_safe.py still bans a hard-coded
    # self-hosted runner.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      # The release scripts in scripts/ci are vendored from argus-config and synced, never
      # edited here (skills#26, argus-config#1269): this fails on a hand-edited copy.
      - name: Release scripts match their lock
        run: bash scripts/ci/release-scripts-check.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check
        run: bash scripts/check.sh
