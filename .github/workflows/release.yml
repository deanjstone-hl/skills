name: Release

# A version is cut when the owner promotes: one per push to `deploy`, never by a merge to
# `main`. Two jobs, in order:
#
#   1. "Test before release (...)": a cheap check first (scripts/release-needed.sh): with no
#      feat, fix, perf, revert or breaking commit since the last tag, the workflow ends
#      green with no test and no version. Otherwise the same check workers run before every
#      push, on the promoted SHA. The name lists what ran, so the Actions page and the hub
#      card read as a sentence.
#   2. "Release": `needs` the test job, so a red test means no version.
#
# The pre-check reads the real history since the last tag, not github.event.commits: a push
# event lists 20 commits at most.
#
# semantic-release only analyses, tags and publishes the GitHub Release (.releaserc.json).
# It commits nothing back: `deploy` is fast-forwarded from `main`, so a commit made here
# would fork the branches. The changelog is the GitHub Release notes.
#
# Modelled on atto1's release.yml (argus-config#1048, #1167). No workflow_run trigger:
# GitHub reports the default branch as the run's branch and semantic-release would
# silently dry-run.

on:
  push:
    branches: [deploy]
  # Manual retry: a release whose run failed is not retried by the next promotion.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test before release (unit tests, skill check)
    # A manual dispatch from main (or any other ref) would tag unpromoted code.
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    outputs:
      releasable: ${{ steps.precheck.outputs.releasable }}
    steps:
      # github.sha: the commit that was promoted (or the tip of deploy for a manual run).
      # Full history and tags: the pre-check looks at the commits since the last v* tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Anything to release?
        id: precheck
        run: bash scripts/release-needed.sh
      - uses: actions/setup-python@v5
        if: steps.precheck.outputs.releasable == 'true'
        with:
          python-version: "3.12"
      - run: pip install pyyaml
        if: steps.precheck.outputs.releasable == 'true'
      # The command workers run before every push, so the two cannot drift.
      - name: Check
        if: steps.precheck.outputs.releasable == 'true'
        run: bash scripts/check.sh

  release:
    name: Release
    needs: test
    if: needs.test.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # `packageManager` in package.json is the one place the pnpm version is pinned.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Up to 3 attempts, each from the remote tip of deploy: a second promotion landing
      # mid-run would otherwise make semantic-release exit 0 having released nothing.
      - name: Release
        run: bash scripts/ci/release-with-retry.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: deploy
